# ADR-0016 / D-173 choice (3): pg_hba allow and reject rules for the summary
# login. Owner-edited (OWNER-STEPS.md); agents never edit pg_hba.conf.
#
# Insert the seven rule lines below, unchanged and in this order, ABOVE every
# other rule of the dev cluster's pg_hba.conf (comments may stay above them).
# pg_hba is first-match, so an allow line alone is no boundary: the initdb
# default `trust` lines for local, 127.0.0.1 and ::1 would still admit the
# login to every database. accept.sh STOPs unless these are rules 1 to 7.
#
#  1     the login may reach sdr_agent_dev over 127.0.0.1 only;
#  2-3   every other database, and replication, over 127.0.0.1: rejected;
#  4-5   the same over ::1: rejected;
#  6-7   the same over the Unix socket (the devenv cluster has one): rejected.
#
# `trust` on line 1 is the owner-accepted procedural residual (D-173 (4)):
# any local process can still connect as any role, including this one and
# postgres. These rules confine where the login can connect; they are not
# authenticated isolation.
host    sdr_agent_dev   sdr_summary_login   127.0.0.1/32   trust
host    all             sdr_summary_login   127.0.0.1/32   reject
host    replication     sdr_summary_login   127.0.0.1/32   reject
host    all             sdr_summary_login   ::1/128        reject
host    replication     sdr_summary_login   ::1/128        reject
local   all             sdr_summary_login                  reject
local   replication     sdr_summary_login                  reject
